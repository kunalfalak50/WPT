<!DOCTYPE html>
<html>
<head>
  <title>Signup Page</title>
  <style>
    body {
      background-color: #53ebca; /* light gray background */
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 350px;
      background-color: white; /* white card */
      margin: 80px auto; /* center + top space */
      padding: 30px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
      border-radius: 5px;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 15px 0; /* spacing between inputs */
      border: none;
      border-bottom: 1px solid rgb(2, 11, 6);
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: black;
      color: white;
      border: none;
      margin-top: 20px;
      cursor: pointer;
    }

    p {
      font-size: 14px;
      margin-top: 10px;
    }

    .error {
      color: red;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Sign Up</h1>

    <input type="text" placeholder="First Name">
    <input type="text" placeholder="Last Name">
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">

    <p>Already a member? <b>Log In</b></p>

    <button>Sign up</button>

    <p class="error">If an error occurs when filling a form, a message will show here.</p>
  </div>

</body>
</html>
