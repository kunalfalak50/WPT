
<html>
<head>
  
  <title>Contact Form</title>
  <style>
    body {
  margin: 0;
  font-family: Arial;
  background: #f2f2f2;
}

/* Main container */
.container {
  display: flex;
  width: 900px;
  margin: 50px auto;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

/* Left side */
.left {
  width: 35%;
  color: white;
  padding: 30px;
  background: linear-gradient(135deg, #4e54c8, #8f94fb);
  position: relative;
}

.left h2 {
  margin-bottom: 20px;
}

.left p {
  font-size: 14px;
  margin: 10px 0;
}

.social span {
  margin-right: 10px;
  font-size: 14px;
}

/* Right side */
.right {
  width: 65%;
  background: white;
  padding: 30px;
}

.right h2 {
  margin-bottom: 20px;
}

.right input,
.right textarea {
  width: 100%;
  border: none;
  border-bottom: 2px solid #ccc;
  padding: 10px;
  margin: 10px 0;
  outline: none;
}

.right textarea {
  height: 80px;
}

/* Button */
.right button {
  width: 100%;
  padding: 12px;
  border: none;
  background: #4e54c8;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}
  </style>
</head>
<body>

<div class="container">

  <!-- Left Panel -->
  <div class="left">
    <h2>Get in touch</h2>

    <p><strong>Name</strong><br>HTML CSS Tutorials</p>
    <p><strong>Email</strong><br>htmlcsstutorials@gmail.com</p>
    <p><strong>Phone</strong><br>+91 1234567890</p>
    <p><strong>Address</strong><br>123 Street, Bangalore, India</p>

    <div class="social">
      <span>f</span>
      <span>t</span>
      <span>ig</span>
      <span>yt</span>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right">
    <h2>Contact Us</h2>

    <input type="text" placeholder="Full Name">
    <input type="email" placeholder="Email">
    <input type="text" placeholder="Website">
    <input type="text" placeholder="Contact Number">

    <textarea placeholder="Message"></textarea>

    <button>Submit</button>
  </div>

</div>

</body>
</html>
