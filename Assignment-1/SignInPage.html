<html >
<head>
  <meta charset="UTF-8">
  <title>Login UI</title>
  <style>
    body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to right, #cfd9df, #e2ebf0);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Main Box */
.container {
  display: flex;
  width: 700px;
  height: 400px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* Left */
.left {
  width: 50%;
  background: #f5f5f5;
  padding: 40px;
  text-align: center;
}

.left h2 {
  margin-bottom: 15px;
}

.icons span {
  border: 1px solid #ccc;
  padding: 8px;
  margin: 5px;
  border-radius: 50%;
  display: inline-block;
  font-size: 12px;
}

.left input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 20px;
  border: none;
  background: #e0e0e0;
}

.left a {
  font-size: 12px;
  color: gray;
  display: block;
  margin-bottom: 15px;
}

.signin {
  background: #4ed62f;
  border: none;
  padding: 10px 30px;
  border-radius: 20px;
  color: white;
  cursor: pointer;
}

/* Right */
.right {
  width: 50%;
  background:#FF80AB;
  color: white;
  text-align: center;
  padding: 40px;
  border-top-left-radius: 50px;
  border-bottom-left-radius: 50px;
}

.right h2 {
  margin-top: 60px;
}

.signup {
  margin-top: 20px;
  padding: 10px 30px;
  border-radius: 20px;
  background: transparent;
  border: 1px solid white;
  color: white;
  cursor: pointer;
}
  </style>
</head>
<body>

<div class="container">
  
  <!-- Left Side -->
  <div class="left">
    <h2>Sign in</h2>

    <div class="icons">
      <span>f</span>
      <span>in</span>
      <span>G</span>
    </div>

    <p>Or sign in using E-Mail Address</p>

    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">

    <a href="#">Forgot your password?</a>

    <button class="signin">SIGN IN</button>
  </div>

  <!-- Right Side -->
  <div class="right">
    <h2>Create,<br>Account!</h2>
    <p>Sign up if you still don't have an account ...</p>
    <button class="signup">SIGN UP</button>
  </div>

</div>

</body>
</html>
