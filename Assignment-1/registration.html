<html>
    <head>
        <title>
            Registration Form
        </title>
        <style>
            body {
        font-family: Arial;
        background-color: #f5f5f5;
    }
    .container {
  width: 900px;
  margin: auto;
  background: white;
  padding: 20px;
}
h1 {
  color: #2a7b6f;
}

.section-title {
  margin-top: 20px;
  font-weight: bold;
  border-bottom: 2px solid #2a7b6f;
  display: inline-block;
}

.form-row {
  display: flex;
  gap: 20px;
  margin-top: 10px;
}

.form-group {
  flex: 1;
}

label {
  display: block;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 5px;
  margin-top: 5px;
}
.gender {
  display: flex;
  gap: 5px;
  margin-top: 10px;
}

.inline {
  display: flex;
  gap: 20px;   /* space between Male & Female */
  align-items: center;
}
.signature {
  display: flex;
  justify-content: space-between;
  margin-top: 40px;
}

.footer {
  margin-top: 20px;
  text-align: center;
}
</style>

    
    </head>
    <body>
        <div class="container">
            <h1>Registration Form</h1>
            <p>This space is where you can share information.</p>

            <div class="section-title">PERSONAL INFORMATION</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text">
                </div>
            </div>
           
            <div class="form-row">
           <div class="form-group">
        <label>Nickname</label>
        <input type="text">
        </div>
         <div class="form-group">
             <label>Place of Birth</label>
             <input type="text">
         </div> 
         </div>
         <div class="form-row">
  <div class="form-group">
    <label>Date of Birth</label>
    <input type="date">
  </div>

  <div class="form-group">
    <label>Nationality</label>
    <input type="text">
  </div>
</div>

<div class="form-row">
  <div class="form-group">
    <label>Email</label>
    <input type="email">
  </div>

  <div class="form-group">
    <label>Domicile</label>
    <input type="text">
  </div>
</div>

 <div class="form-row">
  <div class="form-group">
   <div class="field">
  <label>Gender:</label>

   <div class="gender-options">
    
    <label class="option">
      <input type="radio" name="gender" checked>
      <span class="circle"></span>
      <span class="text">Male</span>
    </label>

    <label class="option">
      <input type="radio" name="gender">
      <span class="circle"></span>
      <span class="text">Female</span>
    </label>
</div>

</div>
  </div>
</div>


<div class="form-row">
  <div class="form-group">
    <label>Phone</label>
    <input type="text">
  </div>

  <div class="form-group">
    <label>Post Code</label>
    <input type="text">
  </div>
</div>

<div class="section-title">ADDRESS</div>

<div class="form-row">
  <div class="form-group">
    <label>Present Address</label>
    <input type="text">
  </div>
</div>

<div class="form-row">
  <div class="form-group">
    <label>City</label>
    <input type="text">
  </div>

  <div class="form-group">
    <label>State</label>
    <input type="text">
  </div>
</div>

<div class="form-row">
  <div class="form-group">
    <label>Zip Code</label>
    <input type="text">
  </div>

  <div class="form-group">
    <label>Student Trustee</label>
    <input type="text">
  </div>
</div>

<div class="signature">
  <div>
    ___________________<br>
    Register Signature
  </div>

  <div>
    ___________________<br>
    Officer Signature
  </div>
</div>

<div class="footer">
  <h3>THANK YOU FOR REGISTRATION</h3>
</div>


        </div>
    </body>
</html>
